<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WebSynth</title>
  <link rel="stylesheet" href="css/base.css">
</head>
<body>
  <main>
    <h1>WebSynth</h1>
    <div id="scale-picker"></div>
    <p class="hint">
      Play with the mouse anywhere on the keyboard, with <kbd>Tab</kbd> and
      <kbd>Space</kbd>, or with the two key rows — which play the two octaves
      right of the line. Chords and the drone sound low, mostly left of it.
    </p>
    <div id="chord-pads"></div>
    <div id="sound-controls"></div>
    <div id="keyboard" class="keyboard" role="group" aria-label="Keyboard, four octaves from C2"></div>
  </main>
  <script type="module" src="js/main.js"></script>
</body>
</html>
