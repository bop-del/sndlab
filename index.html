<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WebSynth</title>
  <link rel="stylesheet" href="css/base.css">
</head>
<body>
  <div id="version-tag" class="version-tag"></div>
  <main>
    <h1>WebSynth</h1>
    <div id="scale-picker"></div>
    <div id="transpose"></div>
    <p class="hint">
      Play with the mouse anywhere on the keyboard, with <kbd>Tab</kbd> and
      <kbd>Space</kbd>, or with the two key rows — which play the two octaves
      right of the line. Move them with the octave buttons, or with
      <kbd>,</kbd> and <kbd>.</kbd> while playing. Chords sound an octave below the
      rows, and the drone an octave below the chords.
    </p>
    <div id="chord-pads"></div>
    <div id="sound-controls"></div>
    <div id="keyboard" class="keyboard" role="group" aria-label="Keyboard, five octaves from C2 to C7"></div>
  </main>
  <script type="module" src="js/main.js"></script>
</body>
</html>
