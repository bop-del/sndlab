<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WebSynth</title>
  <link rel="stylesheet" href="css/base.css">
</head>
<body>
  <main>
    <h1>WebSynth</h1>
    <p class="hint">
      Play with the mouse, with <kbd>Tab</kbd> and <kbd>Space</kbd>, or with the
      two key rows — the bottom row is the lower octave, the top row the upper.
    </p>
    <div id="keyboard" class="keyboard" role="group" aria-label="Keyboard, two octaves from middle C"></div>
  </main>
  <script type="module" src="js/main.js"></script>
</body>
</html>
